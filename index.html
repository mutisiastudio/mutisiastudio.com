<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mutisia Studio</title>
  <meta name="description" content="Mutisia Studio makes apps for Android. Our first app is Pomoluna, a calm focus timer.">
  <link rel="canonical" href="https://mutisiastudio.com/">
  <link rel="alternate" hreflang="en" href="https://mutisiastudio.com/">
  <link rel="alternate" hreflang="es" href="https://mutisiastudio.com/es/">
  <link rel="alternate" hreflang="x-default" href="https://mutisiastudio.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mutisia Studio">
  <meta property="og:description" content="Mutisia Studio makes apps for Android. Our first app is Pomoluna, a calm focus timer.">
  <meta property="og:url" content="https://mutisiastudio.com/">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://mutisiastudio.com/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/assets/img/mutisia-icon.svg">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="studio">
  <header class="band" data-petals>
    <nav class="top" aria-label="Site">
      <span class="menu">
        <a href="#apps">Apps</a>
        <a href="mailto:contact@mutisiastudio.com">Contact</a>
      </span>
    </nav>
    <section class="studio-hero">
      <h1 class="studio-logo">
        <img src="/assets/img/mutisia-mark.svg" alt="" width="64" height="64">
        <span class="studio-name">Mutisia<span>Studio</span></span>
      </h1>
    </section>
  </header>

  <main>
    <section id="apps">
      <p class="tag">Our apps</p>

      <article class="app-card">
        <div>
          <div class="mark badge"><img src="/assets/img/icon.svg" alt=""><span class="word">pomoluna</span></div>
          <h2>Reach your goals,<br>one pomodoro at a time.</h2>
          <p>A calm focus timer for Android, with a sky for every moment.</p>
          <p class="store" data-store-badge>Coming soon to Google Play</p>
          <a class="go" href="/pomoluna/">Meet Pomoluna →</a>
        </div>
        <div class="fan">
          <div class="phone"><img src="/assets/img/shots/en/fan-task.webp" alt="Pomoluna: choosing the task, with the Lava sky" width="600" height="1400"></div>
          <div class="phone mid"><img src="/assets/img/shots/en/fan-clock.webp" alt="Pomoluna: the clock, with the Constellation sky" width="600" height="1400"></div>
          <div class="phone"><img src="/assets/img/shots/en/fan-today.webp" alt="Pomoluna: the summary of the day, with the Aurora sky" width="600" height="1400"></div>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <p class="studio">Mutisia Studio</p>
    <p class="links">
      <a href="/privacy/">Privacy</a>
      <a href="mailto:contact@mutisiastudio.com">Contact</a>
      <a href="/es/">Español</a>
    </p>
    <p class="note">© 2026 Mutisia Studio</p>
  </footer>
<script src="/assets/js/petals.js" defer></script>
<script data-goatcounter="https://mutisiastudio.goatcounter.com/count" async src="/assets/js/count.js"></script>
</body>
</html>
